<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Nova</title>

<link rel="stylesheet" href="{{ url_for('static', path='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/layout.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/glassmorphism-final.css') }}">

</head>

<body class="sidebar-open chat-bg-dark">

<div id="appShell" class="app-shell">

  <aside id="sidebar" class="sidebar">

    <div class="sidebar-header">
      <div class="sidebar-title">Nova</div>

      <button
        id="btnCloseSidebar"
        class="sidebar-close"
        type="button"
      >
        âœ•
      </button>
    </div>

    <div class="sidebar-actions">

      <button
        id="btnNewChat"
        class="sidebar-btn"
        type="button"
      >
        + New Chat
      </button>

      <button
        id="btnOpenMemory"
        class="sidebar-btn"
        type="button"
      >
        Memory
      </button>

    </div>

  </aside>


  <main class="workspace">

    <div
      id="chatWindow"
      class="chat-window"
    ></div>


    <div class="composer">

      <div class="composer-controls">

        <select
          id="modelSelect"
          class="model-select"
          aria-label="Select AI model"
        >
          <option value="">
            Loading models...
          </option>
        </select>

        <div
          id="tokenUsageDisplay"
          class="token-usage-display"
          role="status"
          aria-live="polite"
        >
          Tokens: loading...
        </div>

        <input
          type="file"
          id="fileInput"
          style="display:none;"
        >

        <button
          id="attachBtn"
          type="button"
          title="Attach file"
        >
          ðŸ“Ž
        </button>


        <button
          id="voiceBtn"
          type="button"
          title="Voice input"
        >
          ðŸŽ¤
        </button>

      </div>


      <textarea
        id="composerInput"
        placeholder="Type a message..."
      ></textarea>


      <button
        id="sendBtn"
        type="button"
      >
        Send
      </button>

    </div>

  </main>


  <aside
    id="memoryPanel"
    class="memory-panel"
  >

    <div class="memory-header">

      <h3>Memory</h3>

      <button
        id="closeMemoryPanelBtn"
        type="button"
      >
        âœ•
      </button>

      <button
        id="deleteAllMemoryBtn"
        type="button"
      >
        Delete All
      </button>

    </div>

    <div
      id="memoryStats"
      class="memory-stats"
      role="status"
      aria-live="polite"
    >
      Loading token usage...
    </div>

    <div
      id="memoryList"
      class="memory-list"
    ></div>
  </aside>

</div>


<script src="{{ url_for('static', path='js/app.js') }}"></script>
<script src="{{ url_for('static', path='js/app-api.js') }}"></script>
<script src="{{ url_for('static', path='js/composer.js?v=20260927-2') }}"></script>
<script src="{{ url_for('static', path='js/memory-panel.js') }}"></script>
<script src="{{ url_for('static', path='js/composer_dashboard_ai_tools.js?v=20260928-1') }}"></script>

</body>
</html>
