<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password | Nova</title>

<style>
:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
    background:
        radial-gradient(
            circle at top left,
            rgba(94, 163, 255, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(50, 215, 166, 0.14),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #07111b 0%,
            #0b1623 100%
        );
    color: #eaf2ff;
}

.card {
    width: 100%;
    max-width: 460px;
    padding: 30px;
    border-radius: 24px;
    background: rgba(8, 16, 26, 0.82);
    border: 1px solid rgba(120, 170, 255, 0.14);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
}

.kicker {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.72;
    font-weight: 800;
    margin-bottom: 10px;
}

h1 {
    margin: 0 0 10px;
    font-size: 2rem;
}

p {
    line-height: 1.55;
    opacity: 0.78;
}

form {
    display: grid;
    gap: 16px;
    margin-top: 24px;
}

label {
    display: grid;
    gap: 8px;
    font-weight: 700;
}

input {
    width: 100%;
    min-height: 50px;
    border-radius: 14px;
    padding: 0 14px;
    border: 1px solid rgba(120, 170, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #eaf2ff;
    outline: none;
}

input:focus {
    border-color: rgba(94, 163, 255, 0.42);
    box-shadow: 0 0 0 3px rgba(94, 163, 255, 0.14);
}

button {
    min-height: 50px;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    cursor: pointer;
    color: #08111c;
    background: linear-gradient(
        135deg,
        #7cc7ff,
        #58f0c7
    );
}

.message {
    min-height: 22px;
    font-weight: 700;
}

.message.error {
    color: #ff9f9f;
}

.message.success {
    color: #8ff0c7;
}

.back-link {
    display: inline-block;
    margin-top: 22px;
    color: #9bc9ff;
    text-decoration: none;
    font-weight: 700;
}
</style>
</head>

<body>

<div class="card">

    <div class="kicker">Nova Account Recovery</div>

    <h1>Forgot your password?</h1>

    <p>
        Enter the email associated with your Nova account.
        If an account exists, we will send instructions to reset
        your password.
    </p>

    <form id="forgotPasswordForm">

        <label>
            Email address

            <input
                id="email"
                type="email"
                autocomplete="email"
                required
            >
        </label>

        <div
            id="message"
            class="message"
        ></div>

        <button type="submit">
            Send reset instructions
        </button>

    </form>

    <a
        class="back-link"
        href="/login"
    >
        ← Back to sign in
    </a>

</div>

<script>
(() => {
    "use strict";

    const form = document.getElementById(
        "forgotPasswordForm"
    );

    const emailInput = document.getElementById(
        "email"
    );

    const message = document.getElementById(
        "message"
    );

    function setMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();

            if (!email) {
                setMessage(
                    "Please enter your email address.",
                    "error"
                );
                return;
            }

            try {

                const response = await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",
                        },

                        body: JSON.stringify({
                            email,
                        }),
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        data.message ||
                        "Unable to process request."
                    );
                }

                setMessage(
                    data.message ||
                    "If an account exists, reset instructions have been sent.",
                    "success"
                );

                form.reset();

            } catch (error) {

                setMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

            }

        }
    );

})();
</script>

</body>
</html>
