<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Nova Updates
    </title>


    <style>

        body {

            margin: 0;
            padding: 40px;

            background:
                radial-gradient(
                    circle at top,
                    #1e293b,
                    #020617
                );

            color: #e5e7eb;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        .nova-blog-shell {

            max-width: 1000px;
            margin: auto;

        }


        .header {

            margin-bottom: 35px;

        }


        h1 {

            font-size: 42px;
            color: #22c55e;

        }


        .subtitle {

            color: #94a3b8;

        }


        .post-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .post {

            background:
                rgba(
                    15,
                    23,
                    42,
                    .85
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            border-radius: 18px;

            padding: 24px;

        }


        .post h2 {

            margin-top: 0;

            color:
                #f8fafc;

        }


        .date {

            font-size: 13px;

            color:
                #64748b;

        }


        .empty {

            padding: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

            border-radius: 18px;

        }


    </style>

</head>


<body>


<div class="nova-blog-shell">


<div class="header">

<h1>
Nova Updates
</h1>

<p class="subtitle">
Product updates, engineering notes, and Nova milestones.
</p>

</div>


<div
    id="posts"
    class="post-grid"
>

</div>


</div>



<script>

async function loadPosts() {


    const container =
        document.getElementById(
            "posts"
        );


    try {


        const response =
            await fetch(
                "/api/blog/posts"
            );


        const data =
            await response.json();


        if (
            !data.ok ||
            !data.posts.length
        ) {

            container.innerHTML =
                `
                <div class="empty">
                    No Nova updates yet.
                </div>
                `;

            return;

        }


        container.innerHTML =
            data.posts.map(
                post =>
                `

                <article class="post">

                    <h2>
                        ${post.title}
                    </h2>


                    <div class="date">
                        ${post.created_at || ""}
                    </div>


                    <p>
                        ${post.excerpt || post.body}
                    </p>

                </article>

                `
            ).join("");


    }
    catch(error) {


        container.innerHTML =
            `
            <div class="empty">
                Unable to load updates.
            </div>
            `;

    }


}


loadPosts();


</script>


</body>

</html>
