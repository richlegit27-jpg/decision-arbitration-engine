<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Nova Updates
    </title>


    <style>

        body {

            margin: 0;
            padding: 40px;

            background:
                radial-gradient(
                    circle at top,
                    #1e293b,
                    #020617
                );

            color: #e5e7eb;

            font-family:
                Inter,
                Arial,
                sans-serif;

        }


        .nova-blog-shell {

            max-width: 1000px;
            margin: auto;

        }


        .header {

            margin-bottom: 35px;

        }


        h1 {

            font-size: 42px;
            color: #22c55e;

        }


        .subtitle {

            color: #94a3b8;

        }


        .post-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .post {

            background:
                rgba(
                    15,
                    23,
                    42,
                    .85
                );

            border:
                1px solid
                rgba(
                    255,
                    255,
                    255,
                    .12
                );

            border-radius: 18px;

            padding: 24px;

        }


        .post h2 {

            margin-top: 0;

            color:
                #f8fafc;

        }


        .date {

            font-size: 13px;

            color:
                #64748b;

        }


        .empty {

            padding: 30px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    .05
                );

            border-radius: 18px;

        }

        .post-link { color: inherit; text-decoration: none; }
        .post-link:hover h2 { color: var(--nova-page-accent); }
        .post-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .post-tags span { padding: 4px 8px; border: 1px solid var(--nova-page-line); border-radius: 999px; color: var(--nova-page-muted); font-size: 11px; }


    </style>


<link rel="stylesheet" href="/static/css/nova-pages-polish.css?v=pages-polish-20261003">
</head>


<body>


<div class="nova-blog-shell">


<div class="header">

<h1>
Nova Updates
</h1>

<p class="subtitle">
Updates, practical guides, and notes about building with Nova.
</p>

<nav aria-label="Nova site navigation" class="nova-blog-nav">
    <a href="/app">Open Nova</a><a href="/help">Help</a><a href="/account">Account</a>
</nav>

</div>


<div
    id="posts"
    class="post-grid"
>

</div>


</div>



<script>

async function loadPosts() {


    const container =
        document.getElementById(
            "posts"
        );


    try {


        const response =
            await fetch(
                "/api/blog/posts"
            );


        const data =
            await response.json();


        if (
            !data.ok ||
            !data.posts.length
        ) {

            container.innerHTML =
                `
                <div class="empty">
                    Nova updates, guides, and behind-the-scenes notes will appear here.
                </div>
                `;

            return;

        }


        const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
        const formatDate = (value) => { const date = new Date(value); return Number.isNaN(date.getTime()) ? "" : new Intl.DateTimeFormat(undefined, { dateStyle: "medium" }).format(date); };
        container.innerHTML =
            data.posts.map(
                post =>
                `

                <article class="post">

                    <a href="/blog/${encodeURIComponent(post.slug)}" class="post-link"><h2>${escapeHtml(post.title)}</h2></a>


                    <div class="date">
                        ${escapeHtml(formatDate(post.created_at || post.updated_at))}
                    </div>


                    <p>
                        ${escapeHtml(post.excerpt || post.body)}
                    </p>
                    <div class="post-tags">${(Array.isArray(post.tags) ? post.tags : []).map(tag => `<span>${escapeHtml(tag)}</span>`).join("")}</div>

                </article>

                `
            ).join("");


    }
    catch(error) {


        container.innerHTML =
            `
            <div class="empty">
                Unable to load updates.
            </div>
            `;

    }


}


loadPosts();


</script>


</body>

</html>
