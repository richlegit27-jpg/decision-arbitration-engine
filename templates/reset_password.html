<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | Nova</title>

<style>
:root {
    color-scheme: dark;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
    background:
        radial-gradient(
            circle at top left,
            rgba(94, 163, 255, 0.18),
            transparent 30%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(50, 215, 166, 0.14),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #07111b 0%,
            #0b1623 100%
        );
    color: #eaf2ff;
}

.card {
    width: 100%;
    max-width: 460px;
    padding: 30px;
    border-radius: 24px;
    background: rgba(8, 16, 26, 0.82);
    border: 1px solid rgba(120, 170, 255, 0.14);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
}

.kicker {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.72;
    font-weight: 800;
    margin-bottom: 10px;
}

h1 {
    margin: 0 0 10px;
    font-size: 2rem;
}

p {
    line-height: 1.55;
    opacity: 0.78;
}

form {
    display: grid;
    gap: 16px;
    margin-top: 24px;
}

label {
    display: grid;
    gap: 8px;
    font-weight: 700;
}

input {
    width: 100%;
    min-height: 50px;
    border-radius: 14px;
    padding: 0 14px;
    border: 1px solid rgba(120, 170, 255, 0.14);
    background: rgba(255, 255, 255, 0.06);
    color: #eaf2ff;
    outline: none;
}

input:focus {
    border-color: rgba(94, 163, 255, 0.42);
    box-shadow: 0 0 0 3px rgba(94, 163, 255, 0.14);
}

button {
    min-height: 50px;
    border: none;
    border-radius: 14px;
    font-weight: 800;
    cursor: pointer;
    color: #08111c;
    background: linear-gradient(
        135deg,
        #7cc7ff,
        #58f0c7
    );
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.message {
    min-height: 22px;
    font-weight: 700;
}

.message.error {
    color: #ff9f9f;
}

.message.success {
    color: #8ff0c7;
}

.back-link {
    display: inline-block;
    margin-top: 22px;
    color: #9bc9ff;
    text-decoration: none;
    font-weight: 700;
}
</style>
</head>

<body>

<div class="card">

    <div class="kicker">Nova Account Recovery</div>

    <h1>Set a new password</h1>

    <p>
        Choose a new password for your Nova account.
    </p>

    <form id="resetPasswordForm">

        <label>
            New password

            <input
                id="newPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </label>

        <label>
            Confirm new password

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </label>

        <div
            id="message"
            class="message"
        ></div>

        <button
            id="submitButton"
            type="submit"
        >
            Reset password
        </button>

    </form>

    <a
        class="back-link"
        href="/login"
    >
        ← Back to sign in
    </a>

</div>

<script>
(() => {
    "use strict";

    const form = document.getElementById(
        "resetPasswordForm"
    );

    const newPassword = document.getElementById(
        "newPassword"
    );

    const confirmPassword = document.getElementById(
        "confirmPassword"
    );

    const message = document.getElementById(
        "message"
    );

    const submitButton = document.getElementById(
        "submitButton"
    );

    const params = new URLSearchParams(
        window.location.search
    );

    const token = params.get("token");

    function setMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }

    if (!token) {
        setMessage(
            "This password reset link is invalid or incomplete.",
            "error"
        );

        submitButton.disabled = true;
    }

    form.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();

            if (!token) {
                return;
            }

            const password = newPassword.value;
            const confirmation = confirmPassword.value;

            if (password.length < 8) {
                setMessage(
                    "Password must be at least 8 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmation) {
                setMessage(
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Resetting...";

            try {

                const response = await fetch(
                    "/api/auth/reset-password",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",
                        },

                        body: JSON.stringify({
                            token: token,
                            new_password: password,
                        }),
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        data.message ||
                        "Unable to reset password."
                    );
                }

                setMessage(
                    data.message ||
                    "Password reset successfully.",
                    "success"
                );

                form.reset();

                setTimeout(
                    () => {
                        window.location.href = "/login";
                    },
                    1800
                );

            } catch (error) {

                setMessage(
                    error.message ||
                    "Something went wrong.",
                    "error"
                );

                submitButton.disabled = false;
                submitButton.textContent =
                    "Reset password";
            }

        }
    );

})();
</script>

</body>
</html>
